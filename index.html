*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Alegreya',Georgia,serif}
body{background-image:radial-gradient(circle at 20% 0%,#fff6e2 0,transparent 55%),radial-gradient(circle at 100% 100%,#f1dfbd 0,transparent 50%);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hide{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom))}
/* top */
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,rgba(246,238,221,0));padding:10px 14px 6px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header .ch{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
header .vn{font-size:20px;font-weight:700;color:var(--maroon);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line)}
.ib svg{width:20px;height:20px}
.prog{height:4px;background:var(--line);border-radius:4px;margin:0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--maroon));width:0;transition:width .4s}
/* scene */
.stage{margin:12px 14px 0;border-radius:20px;overflow:hidden;background:#fff;border:2px solid var(--gold);box-shadow:0 8px 24px rgba(90,52,22,.18),inset 0 0 0 4px #fff7e0;position:relative;aspect-ratio:400/260;touch-action:pan-y}
.stage svg{display:block;width:100%;height:100%;font-family:'Alegreya',Georgia,serif}
.stage.fade svg{animation:sceneIn .45s ease both}
@keyframes sceneIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.replay{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,250,240,.85);display:grid;place-items:center;border:1px solid var(--line)}
.replay svg{width:16px;height:16px}
.vtitle{margin:12px 16px 0;font-size:calc(21px*var(--fs));font-weight:700;color:var(--maroon)}
/* text */
.card{margin:10px 14px 0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px}
.spk{display:inline-flex;gap:8px;align-items:baseline;font-size:13px;color:#fff;background:var(--saffron);border-radius:20px;padding:3px 12px;margin:2px 0 8px}
.spk b{font-family:'Noto Serif Devanagari',serif;font-weight:600}
.ln{border-radius:10px;padding:6px 8px;margin:0 -8px;transition:background .25s}
.ln.on{background:var(--hl)}
.sa{font-family:'Noto Serif Devanagari',serif;font-size:calc(20px*var(--fs));line-height:1.6;font-weight:600;color:#3b1d0e}
.ia{font-size:calc(15px*var(--fs));font-style:italic;color:var(--soft);line-height:1.35}
.ln.lab{padding-top:8px}
.ln.lab .spk{margin:0}

/* scene animations */
.a-pulse,.a-boom,.a-pop,.a-glowpulse,.a-dim,.a-twinkle,.a-hl,.a-hourglass,.a-rise,.a-ghost{transform-box:fill-box;transform-origin:center}

.a-pulse{animation:pulse 2.6s ease-in-out infinite}

.a-pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}}

@keyframes fadeIn{from{opacity:0}}
.a-rise{animation:rise .6s ease-out both}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.a-flicker{animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(.9,1.12);opacity:.85}}
.a-bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}

@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

.a-spin{animation:spin 2s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
.a-orbit{animation:spin 9s linear infinite;transform-origin:0 0}
.a-legA{animation:legA .5s ease-in-out infinite alternate;transform-origin:0 0;animation-play-state:paused}
.a-legB{animation:legA .5s ease-in-out infinite alternate-reverse;transform-origin:0 0;animation-play-state:paused}
.a-drive .a-legA,.a-drive .a-legB{animation-play-state:running}
@keyframes legA{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.a-drive{animation:drive 3.4s cubic-bezier(.2,.7,.3,1) both}

.a-quake{animation:shake .3s linear infinite}

@keyframes slip{0%,20%{transform:none}70%,100%{transform:translate(6px,40px) rotate(50deg);opacity:.2}}
.a-tear{animation:tear 2.2s ease-in infinite}

.a-seesaw{animation:seesaw 4s ease-in-out infinite;transform-origin:0 0}
@keyframes seesaw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.a-inward{animation:inward 1.8s ease-in-out infinite}
@keyframes inward{50%{transform:scale(.88)}}
.a-boom{animation:boom .35s ease-in-out infinite alternate}

.a-boomtxt{animation:boomt 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes boomt{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.a-twinkle{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(.5);opacity:.4}}
.a-glowpulse{animation:pulse 1.6s ease-in-out infinite}
.a-draw{stroke-dasharray:300;animation:draw 2.4s ease-out both .4s}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.a-march,.a-glowline{animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.a-scan{animation:scan 4s ease-in-out infinite;transform-origin:0 0}

.a-creep{animation:creep 7s ease-in infinite}

.a-mix{animation:mix 3.5s ease-in-out infinite alternate}
@keyframes mix{to{transform:translateX(var(--dx)) rotate(25deg)}}
.a-windline{animation:wind 3s linear infinite}
@keyframes wind{from{transform:translate(-120px,120px)}to{transform:translate(120px,120px)}}
.a-sink{animation:sink 5s ease-in-out infinite}
@keyframes sink{0%{transform:none;opacity:1}100%{transform:translateY(60px);opacity:.25}}
.a-ghost{animation:ghost 3s ease-in-out infinite}

.a-dim{animation:dim 3s ease-in-out infinite alternate}
@keyframes dim{to{opacity:.3;transform:scale(.8)}}
.a-hourglass{animation:hg 3s ease-in-out infinite}
@keyframes hg{0%,70%{transform:rotate(0)}100%{transform:rotate(180deg)}}

@keyframes float{50%{transform:translateY(-5px)}}

<script>window.VERSES=[{"n": 1, "speaker": "धृतराष्ट्र उवाच", "lines": [{"sa": "धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः", "iast": "dharmakṣetre kurukṣetre samavetā yuyutsavaḥ"}, {"sa": "मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय", "iast": "māmakāḥ pāṇḍavāścaiva kimakurvata sañjaya"}], "speakerEn": "Dhṛtarāṣṭra said", "meaning": "Dhṛtarāṣṭra said: O Sañjaya, on the holy field of Kurukṣetra, the field of dharma, my sons and the sons of Pāṇḍu gathered, eager to fight. What did they do?", "title": "The blind king asks"}, {"n": 2, "speaker": "सञ्जय उवाच", "lines": [{"sa": "दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा", "iast": "dṛṣṭvā tu pāṇḍavānīkaṃ vyūḍhaṃ duryodhanastadā"}, {"sa": "आचार्यमुपसङ्गम्य राजा वचनमब्रवीत्", "iast": "ācāryamupasaṅgamya rājā vacanamabravīt"}], "speakerEn": "Sañjaya said", "meaning": "Sañjaya said: Seeing the Pāṇḍava army drawn up for battle, King Duryodhana went up to his teacher Droṇa and spoke these words.", "title": "Duryodhana goes to Droṇa"}, {"n": 3, "speaker": null, "lines": [{"sa": "पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम्", "iast": "paśyaitāṃ pāṇḍuputrāṇāmācārya mahatīṃ camūm"}, {"sa": "व्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता", "iast": "vyūḍhāṃ drupadaputreṇa tava śiṣyeṇa dhīmatā"}], "meaning": "“Teacher, look at this mighty army of the sons of Pāṇḍu, arranged in battle order by your own clever student, the son of Drupada (Dhṛṣṭadyumna).", "title": "“Look at their army!”"}, {"n": 4, "speaker": null, "lines": [{"sa": "अत्र शूरा महेष्वासा भीमार्जुनसमा युधि", "iast": "atra śūrā maheṣvāsā bhīmārjunasamā yudhi"}, {"sa": "युयुधानो विराटश्च द्रुपदश्च महारथः", "iast": "yuyudhāno virāṭaśca drupadaśca mahārathaḥ"}], "meaning": "Here are heroes and great archers, equal in battle to Bhīma and Arjuna: Yuyudhāna (Sātyaki), Virāṭa, and Drupada, the great chariot-warrior;", "title": "Heroes of the Pāṇḍavas"}, {"n": 5, "speaker": null, "lines": [{"sa": "धृष्टकेतुश्चेकितानः काशिराजश्च वीर्यवान्", "iast": "dhṛṣṭaketuścekitānaḥ kāśirājaśca vīryavān"}, {"sa": "पुरुजित्कुन्तिभोजश्च शैब्यश्च नरपुङ्गवः", "iast": "purujitkuntibhojaśca śaibyaśca narapuṅgavaḥ"}], "meaning": "Dhṛṣṭaketu, Cekitāna, the valiant king of Kāśī, Purujit, Kuntibhoja, and Śaibya, the finest of men;", "title": "More Pāṇḍava heroes"}, {"n": 6, "speaker": null, "lines": [{"sa": "युधामन्युश्च विक्रान्त उत्तमौजाश्च वीर्यवान्", "iast": "yudhāmanyuśca vikrānta uttamaujāśca vīryavān"}, {"sa": "सौभद्रो द्रौपदेयाश्च सर्व एव महारथाः", "iast": "saubhadro draupadeyāśca sarva eva mahārathāḥ"}], "meaning": "the brave Yudhāmanyu, the strong Uttamaujā, the son of Subhadrā (Abhimanyu), and the sons of Draupadī. All of them are great chariot-warriors.", "title": "Young warriors"}, {"n": 7, "speaker": null, "lines": [{"sa": "अस्माकं तु विशिष्टा ये तान्निबोध द्विजोत्तम", "iast": "asmākaṃ tu viśiṣṭā ye tānnibodha dvijottama"}, {"sa": "नायका मम सैन्यस्य संज्ञार्थं तान्ब्रवीमि ते", "iast": "nāyakā mama sainyasya saṃjñārthaṃ tānbravīmi te"}], "meaning": "Now hear, O best of the twice-born, about the leaders of our own army. I name them for you.", "title": "“Hear about our leaders”"}, {"n": 8, "speaker": null, "lines": [{"sa": "भवान्भीष्मश्च कर्णश्च कृपश्च समितिञ्जयः", "iast": "bhavānbhīṣmaśca karṇaśca kṛpaśca samitiñjayaḥ"}, {"sa": "अश्वत्थामा विकर्णश्च सौमदत्तिस्तथैव च", "iast": "aśvatthāmā vikarṇaśca saumadattistathaiva ca"}], "meaning": "Yourself, Bhīṣma, Karṇa, and Kṛpa, always victorious in battle; Aśvatthāmā, Vikarṇa, and the son of Somadatta (Bhūriśravā).", "title": "Kaurava commanders"}, {"n": 9, "speaker": null, "lines": [{"sa": "अन्ये च बहवः शूरा मदर्थे त्यक्तजीविताः", "iast": "anye ca bahavaḥ śūrā madarthe tyaktajīvitāḥ"}, {"sa": "नानाशस्त्रप्रहरणाः सर्वे युद्धविशारदाः", "iast": "nānāśastrapraharaṇāḥ sarve yuddhaviśāradāḥ"}], "meaning": "And there are many other heroes, ready to give their lives for me, armed with many kinds of weapons, all skilled in war.", "title": "Many brave warriors"}, {"n": 10, "speaker": null, "lines": [{"sa": "अपर्याप्तं तदस्माकं बलं भीष्माभिरक्षितम्", "iast": "aparyāptaṃ tadasmākaṃ balaṃ bhīṣmābhirakṣitam"}, {"sa": "पर्याप्तं त्विदमेतेषां बलं भीमाभिरक्षितम्", "iast": "paryāptaṃ tvidameteṣāṃ balaṃ bhīmābhirakṣitam"}], "meaning": "Our strength, guarded by Bhīṣma, is beyond measure; their strength, guarded by Bhīma, is limited. (Some read it the other way: ours is not enough, theirs is ample.)", "title": "Weighing the two armies"}, {"n": 11, "speaker": null, "lines": [{"sa": "अयनेषु च सर्वेषु यथाभागमवस्थिताः", "iast": "ayaneṣu ca sarveṣu yathābhāgamavasthitāḥ"}, {"sa": "भीष्ममेवाभिरक्षन्तु भवन्तः सर्व एव हि", "iast": "bhīṣmamevābhirakṣantu bhavantaḥ sarva eva hi"}], "meaning": "So all of you, standing firm at your posts at every entrance of the formation, must protect Bhīṣma above all.”", "title": "“Protect Bhīṣma!”"}, {"n": 12, "speaker": null, "lines": [{"sa": "तस्य संजनयन्हर्षं कुरुवृद्धः पितामहः", "iast": "tasya saṃjanayanharṣaṃ kuruvṛddhaḥ pitāmahaḥ"}, {"sa": "सिंहनादं विनद्योच्चैः शङ्खं दध्मौ प्रतापवान्", "iast": "siṃhanādaṃ vinadyoccaiḥ śaṅkhaṃ dadhmau pratāpavān"}], "meaning": "Then Bhīṣma, the mighty grandsire and eldest of the Kurus, roared like a lion and blew his conch loudly, bringing joy to Duryodhana.", "title": "Bhīṣma’s lion-roar"}, {"n": 13, "speaker": null, "lines": [{"sa": "ततः शङ्खाश्च भेर्यश्च पणवानकगोमुखाः", "iast": "tataḥ śaṅkhāśca bheryaśca paṇavānakagomukhāḥ"}, {"sa": "सहसैवाभ्यहन्यन्त स शब्दस्तुमुलोऽभवत्", "iast": "sahasaivābhyahanyanta sa śabdastumulo’bhavat"}], "meaning": "At once conches, kettledrums, tabors, drums and horns all blared together, and the sound was tremendous.", "title": "A thunder of drums"}, {"n": 14, "speaker": null, "lines": [{"sa": "ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ", "iast": "tataḥ śvetairhayairyukte mahati syandane sthitau"}, {"sa": "माधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः", "iast": "mādhavaḥ pāṇḍavaścaiva divyau śaṅkhau pradadhmatuḥ"}], "meaning": "Then, standing in their great chariot yoked to white horses, Mādhava (Kṛṣṇa) and the son of Pāṇḍu (Arjuna) blew their divine conches.", "title": "The white-horsed chariot"}, {"n": 15, "speaker": null, "lines": [{"sa": "पाञ्चजन्यं हृषीकेशो देवदत्तं धनंजयः", "iast": "pāñcajanyaṃ hṛṣīkeśo devadattaṃ dhanaṃjayaḥ"}, {"sa": "पौण्ड्रं दध्मौ महाशङ्खं भीमकर्मा वृकोदरः", "iast": "pauṇḍraṃ dadhmau mahāśaṅkhaṃ bhīmakarmā vṛkodaraḥ"}], "meaning": "Hṛṣīkeśa (Kṛṣṇa) blew Pāñcajanya, Dhanañjaya (Arjuna) blew Devadatta, and Bhīma, of mighty deeds, blew the great conch Pauṇḍra.", "title": "Three great conches"}, {"n": 16, "speaker": null, "lines": [{"sa": "अनन्तविजयं राजा कुन्तीपुत्रो युधिष्ठिरः", "iast": "anantavijayaṃ rājā kuntīputro yudhiṣṭhiraḥ"}, {"sa": "नकुलः सहदेवश्च सुघोषमणिपुष्पकौ", "iast": "nakulaḥ sahadevaśca sughoṣamaṇipuṣpakau"}], "meaning": "King Yudhiṣṭhira, son of Kuntī, blew Anantavijaya; Nakula and Sahadeva blew Sughoṣa and Maṇipuṣpaka.", "title": "The brothers’ conches"}, {"n": 17, "speaker": null, "lines": [{"sa": "काश्यश्च परमेष्वासः शिखण्डी च महारथः", "iast": "kāśyaśca parameṣvāsaḥ śikhaṇḍī ca mahārathaḥ"}, {"sa": "धृष्टद्युम्नो विराटश्च सात्यकिश्चापराजितः", "iast": "dhṛṣṭadyumno virāṭaśca sātyakiścāparājitaḥ"}], "meaning": "The great archer, the king of Kāśī; the great chariot-warrior Śikhaṇḍī; Dhṛṣṭadyumna, Virāṭa, and the unconquered Sātyaki;", "title": "Allies sound their conches"}, {"n": 18, "speaker": null, "lines": [{"sa": "द्रुपदो द्रौपदेयाश्च सर्वशः पृथिवीपते", "iast": "drupado draupadeyāśca sarvaśaḥ pṛthivīpate"}, {"sa": "सौभद्रश्च महाबाहुः शङ्खान्दध्मुः पृथक्पृथक्", "iast": "saubhadraśca mahābāhuḥ śaṅkhāndadhmuḥ pṛthakpṛthak"}], "meaning": "Drupada, the sons of Draupadī, and the mighty-armed son of Subhadrā: O lord of the earth, they all blew their own conches, one after another.", "title": "Conch after conch"}, {"n": 19, "speaker": null, "lines": [{"sa": "स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत्", "iast": "sa ghoṣo dhārtarāṣṭrāṇāṃ hṛdayāni vyadārayat"}, {"sa": "नभश्च पृथिवीं चैव तुमुलो व्यनुनादयन्", "iast": "nabhaśca pṛthivīṃ caiva tumulo vyanunādayan"}], "meaning": "That tremendous sound, echoing through the sky and the earth, tore the hearts of Dhṛtarāṣṭra’s sons.", "title": "Hearts shaken"}, {"n": 20, "speaker": null, "lines": [{"sa": "अथ व्यवस्थितान् दृष्ट्वा धार्तराष्ट्रान्कपिध्वजः", "iast": "atha vyavasthitān dṛṣṭvā dhārtarāṣṭrānkapidhvajaḥ"}, {"sa": "प्रवृत्ते शस्त्रसंपाते धनुरुद्यम्य पाण्डवः", "iast": "pravṛtte śastrasaṃpāte dhanurudyamya pāṇḍavaḥ"}], "meaning": "Then, seeing Dhṛtarāṣṭra’s sons standing in battle order as the weapons were about to fly, Arjuna, whose banner bears Hanumān, raised his bow,", "title": "Arjuna lifts his bow"}, {"n": 21, "speaker": null, "lines": [{"sa": "हृषीकेशं तदा वाक्यमिदमाह महीपते", "iast": "hṛṣīkeśaṃ tadā vākyamidamāha mahīpate"}, {"spk": "अर्जुन उवाच", "en": "Arjuna said"}, {"sa": "सेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत", "iast": "senayorubhayormadhye rathaṃ sthāpaya me’cyuta"}], "meaning": "and spoke these words to Hṛṣīkeśa (Kṛṣṇa), O King. Arjuna said: “O Acyuta, unfailing one, place my chariot between the two armies,", "title": "“Take me to the middle”"}, {"n": 22, "speaker": null, "lines": [{"sa": "यावदेतान्निरीक्षेऽहं योद्धुकामानवस्थितान्", "iast": "yāvadetānnirīkṣe’haṃ yoddhukāmānavasthitān"}, {"sa": "कैर्मया सह योद्धव्यमस्मिन्रणसमुद्यमे", "iast": "kairmayā saha yoddhavyamasminraṇasamudyame"}], "meaning": "so that I may look at those standing here eager to fight, and see whom I must fight in this great battle.", "title": "“Whom must I fight?”"}, {"n": 23, "speaker": null, "lines": [{"sa": "योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः", "iast": "yotsyamānānavekṣe’haṃ ya ete’tra samāgatāḥ"}, {"sa": "धार्तराष्ट्रस्य दुर्बुद्धेर्युद्धे प्रियचिकीर्षवः", "iast": "dhārtarāṣṭrasya durbuddheryuddhe priyacikīrṣavaḥ"}], "meaning": "I want to see those who have gathered here to fight, wishing to please the evil-minded son of Dhṛtarāṣṭra.”", "title": "“Let me see them”"}, {"n": 24, "speaker": "संजय उवाच", "lines": [{"sa": "एवमुक्तो हृषीकेशो गुडाकेशेन भारत", "iast": "evamukto hṛṣīkeśo guḍākeśena bhārata"}, {"sa": "सेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तमम्", "iast": "senayorubhayormadhye sthāpayitvā rathottamam"}], "speakerEn": "Sañjaya said", "meaning": "Sañjaya said: O descendant of Bharata, asked this by Guḍākeśa (Arjuna, conqueror of sleep), Hṛṣīkeśa drove that finest chariot between the two armies,", "title": "Into the middle"}, {"n": 25, "speaker": null, "lines": [{"sa": "भीष्मद्रोणप्रमुखतः सर्वेषां च महीक्षिताम्", "iast": "bhīṣmadroṇapramukhataḥ sarveṣāṃ ca mahīkṣitām"}, {"sa": "उवाच पार्थ पश्यैतान्समवेतान्कुरूनिति", "iast": "uvāca pārtha paśyaitānsamavetānkurūniti"}], "meaning": "in front of Bhīṣma, Droṇa and all the kings of the earth, and said: “O Pārtha, behold all these Kurus gathered here.”", "title": "“Behold the Kurus!”"}, {"n": 26, "speaker": null, "lines": [{"sa": "तत्रापश्यत्स्थितान्पार्थः पितॄनथ पितामहान्", "iast": "tatrāpaśyatsthitānpārthaḥ pitṝnatha pitāmahān"}, {"sa": "आचार्यान्मातुलान्भ्रातॄन्पुत्रान्पौत्रान्सखींस्तथा", "iast": "ācāryānmātulānbhrātṝnputrānpautrānsakhīṃstathā"}], "meaning": "There, in both armies, Arjuna saw fathers and grandfathers, teachers, uncles, brothers, sons, grandsons, and friends,", "title": "Family on both sides"}, {"n": 27, "speaker": null, "lines": [{"sa": "श्वशुरान्सुहृदश्चैव सेनयोरुभयोरपि", "iast": "śvaśurānsuhṛdaścaiva senayorubhayorapi"}, {"sa": "तान्समीक्ष्य स कौन्तेयः सर्वान्बन्धूनवस्थितान्", "iast": "tānsamīkṣya sa kaunteyaḥ sarvānbandhūnavasthitān"}], "meaning": "fathers-in-law and well-wishers too. Seeing all these relatives standing there, the son of Kuntī…", "title": "All his kin"}, {"n": 28, "speaker": null, "lines": [{"sa": "कृपया परयाऽऽविष्टो विषीदन्निदमब्रवीत्", "iast": "kṛpayā parayāviṣṭo viṣīdannidamabravīt"}, {"spk": "अर्जुन उवाच", "en": "Arjuna said"}, {"sa": "दृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुपस्थितम्", "iast": "dṛṣṭvemaṃ svajanaṃ kṛṣṇa yuyutsuṃ samupasthitam"}], "meaning": "…was filled with deep compassion, and sorrowfully said: Arjuna said: “O Kṛṣṇa, seeing my own people standing here, eager to fight,", "title": "Overcome with pity"}, {"n": 29, "speaker": null, "lines": [{"sa": "सीदन्ति मम गात्राणि मुखं च परिशुष्यति", "iast": "sīdanti mama gātrāṇi mukhaṃ ca pariśuṣyati"}, {"sa": "वेपथुश्च शरीरे मे रोमहर्षश्च जायते", "iast": "vepathuśca śarīre me romaharṣaśca jāyate"}], "meaning": "my limbs give way and my mouth is drying up. My body trembles and my hair stands on end.", "title": "Trembling"}, {"n": 30, "speaker": null, "lines": [{"sa": "गाण्डीवं स्रंसते हस्तात्त्वक्चैव परिदह्यते", "iast": "gāṇḍīvaṃ sraṃsate hastāttvakcaiva paridahyate"}, {"sa": "न च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः", "iast": "na ca śaknomyavasthātuṃ bhramatīva ca me manaḥ"}], "meaning": "My bow Gāṇḍīva is slipping from my hand, and my skin is burning. I cannot stand steady, and my mind seems to be whirling.", "title": "The bow slips"}, {"n": 31, "speaker": null, "lines": [{"sa": "निमित्तानि च पश्यामि विपरीतानि केशव", "iast": "nimittāni ca paśyāmi viparītāni keśava"}, {"sa": "न च श्रेयोऽनुपश्यामि हत्वा स्वजनमाहवे", "iast": "na ca śreyo’nupaśyāmi hatvā svajanamāhave"}], "meaning": "O Keśava, I see bad omens. I see no good in killing my own people in battle.", "title": "Bad omens"}, {"n": 32, "speaker": null, "lines": [{"sa": "न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च", "iast": "na kāṅkṣe vijayaṃ kṛṣṇa na ca rājyaṃ sukhāni ca"}, {"sa": "किं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा", "iast": "kiṃ no rājyena govinda kiṃ bhogairjīvitena vā"}], "meaning": "O Kṛṣṇa, I do not want victory, or a kingdom, or pleasures. O Govinda, what use to us is a kingdom, or enjoyment, or even life itself?", "title": "“I want no kingdom”"}, {"n": 33, "speaker": null, "lines": [{"sa": "येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च", "iast": "yeṣāmarthe kāṅkṣitaṃ no rājyaṃ bhogāḥ sukhāni ca"}, {"sa": "त इमेऽवस्थिता युद्धे प्राणांस्त्यक्त्वा धनानि च", "iast": "ta ime’vasthitā yuddhe prāṇāṃstyaktvā dhanāni ca"}], "meaning": "The very people for whose sake we want a kingdom, enjoyment and pleasure stand here in battle, ready to give up their lives and wealth:", "title": "“For whom, then?”"}, {"n": 34, "speaker": null, "lines": [{"sa": "आचार्याः पितरः पुत्रास्तथैव च पितामहाः", "iast": "ācāryāḥ pitaraḥ putrāstathaiva ca pitāmahāḥ"}, {"sa": "मातुलाः श्वशुराः पौत्राः श्यालाः सम्बन्धिनस्तथा", "iast": "mātulāḥ śvaśurāḥ pautrāḥ śyālāḥ sambandhinastathā"}], "meaning": "teachers, fathers, sons, and grandfathers too; uncles, fathers-in-law, grandsons, brothers-in-law and other relatives.", "title": "Teachers and relatives"}, {"n": 35, "speaker": null, "lines": [{"sa": "एतान्न हन्तुमिच्छामि घ्नतोऽपि मधुसूदन", "iast": "etānna hantumicchāmi ghnato’pi madhusūdana"}, {"sa": "अपि त्रैलोक्यराज्यस्य हेतोः किं नु महीकृते", "iast": "api trailokyarājyasya hetoḥ kiṃ nu mahīkṛte"}], "meaning": "O Madhusūdana, I do not wish to kill them, even if they kill me: not even to rule the three worlds, let alone this earth!", "title": "“Not even for three worlds”"}, {"n": 36, "speaker": null, "lines": [{"sa": "निहत्य धार्तराष्ट्रान्नः का प्रीतिः स्याज्जनार्दन", "iast": "nihatya dhārtarāṣṭrānnaḥ kā prītiḥ syājjanārdana"}, {"sa": "पापमेवाश्रयेदस्मान्हत्वैतानाततायिनः", "iast": "pāpamevāśrayedasmānhatvaitānātatāyinaḥ"}], "meaning": "O Janārdana, what joy could we have in killing the sons of Dhṛtarāṣṭra? Only sin would come to us by killing these aggressors.", "title": "“What joy in this?”"}, {"n": 37, "speaker": null, "lines": [{"sa": "तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान्स्वबान्धवान्", "iast": "tasmānnārhā vayaṃ hantuṃ dhārtarāṣṭrānsvabāndhavān"}, {"sa": "स्वजनं हि कथं हत्वा सुखिनः स्याम माधव", "iast": "svajanaṃ hi kathaṃ hatvā sukhinaḥ syāma mādhava"}], "meaning": "So it is not right for us to kill the sons of Dhṛtarāṣṭra, our own relatives. O Mādhava, how could we be happy after killing our own people?", "title": "“How could we be happy?”"}, {"n": 38, "speaker": null, "lines": [{"sa": "यद्यप्येते न पश्यन्ति लोभोपहतचेतसः", "iast": "yadyapyete na paśyanti lobhopahatacetasaḥ"}, {"sa": "कुलक्षयकृतं दोषं मित्रद्रोहे च पातकम्", "iast": "kulakṣayakṛtaṃ doṣaṃ mitradrohe ca pātakam"}], "meaning": "Even if they, their minds clouded by greed, see no wrong in destroying a family and no sin in betraying friends,", "title": "Clouded by greed"}, {"n": 39, "speaker": null, "lines": [{"sa": "कथं न ज्ञेयमस्माभिः पापादस्मान्निवर्तितुम्", "iast": "kathaṃ na jñeyamasmābhiḥ pāpādasmānnivartitum"}, {"sa": "कुलक्षयकृतं दोषं प्रपश्यद्भिर्जनार्दन", "iast": "kulakṣayakṛtaṃ doṣaṃ prapaśyadbhirjanārdana"}], "meaning": "why should we, who clearly see the wrong in destroying a family, not know to turn away from this sin, O Janārdana?", "title": "“We can see the wrong”"}, {"n": 40, "speaker": null, "lines": [{"sa": "कुलक्षये प्रणश्यन्ति कुलधर्माः सनातनाः", "iast": "kulakṣaye praṇaśyanti kuladharmāḥ sanātanāḥ"}, {"sa": "धर्मे नष्टे कुलं कृत्स्नमधर्मोऽभिभवत्युत", "iast": "dharme naṣṭe kulaṃ kṛtsnamadharmo’bhibhavatyuta"}], "meaning": "When a family is destroyed, its age-old traditions perish. When those traditions are lost, adharma (unrighteousness) overtakes the whole family.", "title": "Traditions crumble"}, {"n": 41, "speaker": null, "lines": [{"sa": "अधर्माभिभवात्कृष्ण प्रदुष्यन्ति कुलस्त्रियः", "iast": "adharmābhibhavātkṛṣṇa praduṣyanti kulastriyaḥ"}, {"sa": "स्त्रीषु दुष्टासु वार्ष्णेय जायते वर्णसङ्करः", "iast": "strīṣu duṣṭāsu vārṣṇeya jāyate varṇasaṅkaraḥ"}], "meaning": "O Kṛṣṇa, when adharma prevails, the women of the family are led astray; and when that happens, O Vārṣṇeya, the social order becomes confused (varṇa-saṅkara).", "title": "Order falls apart"}, {"n": 42, "speaker": null, "lines": [{"sa": "सङ्करो नरकायैव कुलघ्नानां कुलस्य च", "iast": "saṅkaro narakāyaiva kulaghnānāṃ kulasya ca"}, {"sa": "पतन्ति पितरो ह्येषां लुप्तपिण्डोदकक्रियाः", "iast": "patanti pitaro hyeṣāṃ luptapiṇḍodakakriyāḥ"}], "meaning": "This confusion leads both the family and those who destroyed it to hell. Their ancestors fall too, deprived of the offerings of rice-balls and water. </script><script>/* My-voice support: record per verse (Sanskrit + English), store on device, export/import, bundled audio. */
window.MyVoice=(function(){
  const DBN='gita-voice',ST='rec';let dbp=null;
  function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
  async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(ST,mode);const r=fn(t.objectStore(ST));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
  const get=k=>tx('readonly',s=>s.get(k)), put=(k,v)=>tx('readwrite',s=>s.put(v,k)), del=k=>tx('readwrite',s=>s.delete(k)), keys=()=>tx('readonly',s=>s.getAllKeys());
  let have=new Set(), bundled={};

  async function loadBundled(){try{const r=await fetch('audio/index.json',{cache:'no-cache'});if(r.ok){const j=await r.json();for(const k in j)bundled[k]={url:'audio/'+j[k].file,dur:j[k].dur}}}catch(e){}}

  function own(k){return have.has(k)}

    return null;
  }
  async function info(k){if(!have.has(k))return null;const v=await get(k);return v?{dur:v.dur,type:v.type}:null}
  async function save(k,rec){const buf=await rec.blob.arrayBuffer();await put(k,{buf,dur:rec.dur,type:rec.blob.type||'audio/mp4',at:Date.now()});have.add(k)}
  const blobOf=v=>v?(v.buf?new Blob([v.buf],{type:v.type||'audio/mp4'}):v.blob||null):null;

function openSheet(id){$('#scrim').classList.remove('hide');$(id).classList.remove('hide')}
function closeSheets(){if(MyVoice.recording()){MyVoice.cancel();recUI(null)}try{player.pause()}catch(e){}['#scrim','#gridSheet','#setSheet','#micSheet'].forEach(i=>$(i).classList.add('hide'))}
$('#scrim').onclick=closeSheets;
$('#bGrid').onclick=()=>{$('#grid').innerHTML=V.map(v=>`<button class="${v.n===cur?'cur':seen.has(v.n)?'seen':''}" data-n="${v.n}">${v.n}${MyVoice.has(v.n+'-sa')||MyVoice.has(v.n+'-en')?`<i class="dot ${MyVoice.has(v.n+'-sa')&&MyVoice.has(v.n+'-en')?'full':''}"></i>`:''}</button>`).join('');openSheet('#gridSheet')};
$('#grid').onclick=e=>{const n=+(e.target.closest('button')||{}).dataset?.n;if(n){closeSheets();show(n)}};
function fillVoices(){const list=saVoices(),sel=$('#sVoice');sel.innerHTML=list.length?list.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join(''):'<option value="">Device default (hi-IN)</option>';const p=pickVoice();if(p)sel.value=p.voiceURI}
$('#bSet').onclick=()=>{loadVoices();fillVoices();$('#sRate').value=S.rate;$('#sRep').value=S.repeat;$('#sMean').checked=S.meaning;$('#sOwn').checked=S.own;$('#sTr').checked=S.tr;$('#sShowMean').checked=S.showMean;$('#sAnim').checked=S.anim;$('#sFs').value=S.fs;openSheet('#setSheet')};
$('#sVoice').onchange=e=>{S.voice=e.target.value;save()};
$('#sRate').oninput=e=>{S.rate=+e.target.value;save()};
$('#sRep').onchange=e=>{S.repeat=+e.target.value;save()};
$('#sMean').onchange=e=>{S.meaning=e.target.checked;save()};
$('#sOwn').onchange=e=>{S.own=e.target.checked;save();srcChip()};
$('#sTr').onchange=e=>{S.tr=e.target.checked;save();applyView()};
$('#sShowMean').onchange=e=>{S.showMean=e.target.checked;save();applyView()};
$('#sAnim').onchange=e=>{S.anim=e.target.checked;save();applyView()};
$('#sFs').oninput=e=>{S.fs=+e.target.value;save();applyView()};
$('#sTest').onclick=()=>{if(!synth)return toast('No speech support in this browser');synth.cancel();const t=++token;say('धर्मक्षेत्रे कुरुक्षेत्रे',{voice:pickVoice(),lang:'hi-IN',rate:S.rate},t)};
$('#sDone').onclick=closeSheets;

/* ---------- my voice recorder ---------- */
document.body.insertAdjacentHTML('beforeend',`<div class="sheet hide" id="micSheet"><div class="rh"><h2 id="mTitle" style="margin:0"></h2><button class="btn alt" id="mClose" style="padding:8px 14px">Done</button></div>
<div class="vstat" id="mStat"></div>
<div class="recbox" data-l="sa"><div class="rh"><b>1 · Sanskrit śloka</b><span class="badge" id="bdg-sa"></span></div><div class="prompt dv" id="pr-sa"></div>
 <div class="ctr"><button class="btn recb" data-act="rec">${ICON.mic}<span>Record</span></button><button class="btn alt" data-act="play">▶ Listen</button><button class="btn alt" data-act="del">Delete</button></div><div class="meter"><i></i><span>0:00</span></div></div>
<div class="recbox" data-l="en"><div class="rh"><b>2 · English meaning</b><span class="badge" id="bdg-en"></span></div><div class="prompt" id="pr-en"></div>
 <div class="ctr"><button class="btn recb" data-act="rec">${ICON.mic}<span>Record</span></button><button class="btn alt" data-act="play">▶ Listen</button><button class="btn alt" data-act="del">Delete</button></div><div class="meter"><i></i><span>0:00</span></div></div>
<div class="row" style="border:0"><button class="btn alt" id="mPrev">◀ Verse</button><button class="btn" id="mNext">Next verse ▶</button></div>
<details class="bk"><summary>Back up, share or import recordings</summary>
 <p>Recordings stay on this phone. Save a backup file to keep them safe, move them to another phone, or send it to have your voice built into the app for everyone.</p>
 <div class="ctr"><button class="btn alt" id="mExp">Save / share backup</button><label class="btn alt">Import…<input type="file" id="mImp" accept="audio/*,.zip,.m4a,.mp3,.wav,.webm,.ogg" multiple hidden></label></div>
 <p class="tiny">Importing your own audio files: name them like <b>1.21-sa.m4a</b> and <b>1.21-en.m4a</b> (verse number, then sa or en).</p></details>
<p class="tiny">Tip: find a quiet room, hold the phone a hand’s width away, and wait a moment after tapping Record before you begin.</p></div>`);
let recL=null;
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
async function fillMic(){
  await MyVoice.ready; const v=V[cur-1];
  $('#mTitle').textContent=`My voice · Verse 1.${cur}`;
  $('#mStat').textContent=`Recorded so far: Sanskrit ${MyVoice.count('sa')}/47 · English ${MyVoice.count('en')}/47`;
  $('#pr-sa').innerHTML=(v.speaker?`<div class="spkp">${v.speaker}</div>`:'')+v.lines.map(l=>l.spk?`<div class="spkp">${l.spk}</div>`:`<div>${l.sa}</div>`).join('');
  $('#pr-en').textContent=v.meaning;
  for(const l of ['sa','en']){const k=cur+'-'+l, inf=await MyVoice.info(k), bx=document.querySelector(`.recbox[data-l="${l}"]`);
    $('#bdg-'+l).textContent=inf?`✓ recorded · ${fmt(inf.dur)}`:MyVoice.has(k)?'✓ built-in recording':'not recorded';
    $('#bdg-'+l).classList.toggle('ok',!!inf||MyVoice.has(k));
    bx.querySelector('[data-act=play]').disabled=!MyVoice.has(k); bx.querySelector('[data-act=del]').disabled=!inf;
    bx.querySelector('.recb span').textContent=inf?'Re-record':'Record'}
  $('#mPrev').disabled=cur===1; $('#mNext').disabled=cur===N;
}
function recUI(l,lv,tm){document.querySelectorAll('.recbox').forEach(b=>{const on=b.dataset.l===l;b.classList.toggle('live',on);b.querySelector('.recb span').textContent=on?'Stop & save':(b.querySelector('.recb span').textContent==='Stop & save'?'Record':b.querySelector('.recb span').textContent);if(on){b.querySelector('.meter i').style.width=Math.min(100,lv*140)+'%';b.querySelector('.meter span').textContent=fmt(tm)}})}
$('#bMic').onclick=()=>{stopSpeech();if(!MyVoice.canRecord()&&!MyVoice.count('sa')&&!MyVoice.count('en'))note('This browser cannot record audio here. Open the installed app (or the hosted link) in Chrome or Safari to record your voice. You can still import audio files from “My voice”.');fillMic();openSheet('#micSheet')};
$('#micSheet').addEventListener('click',async e=>{
  const btn=e.target.closest('[data-act]'); if(!btn) return; const l=btn.closest('.recbox').dataset.l, k=cur+'-'+l, act=btn.dataset.act;
  if(act==='rec'){
    if(recL===l){const r=await MyVoice.stop();recL=null;recUI(null);if(r&&r.dur>0.6&&r.blob.size>800){await MyVoice.save(k,r);toast('Saved');pre={n:0};preload(cur);srcChip()}else toast('That was too short; try again');fillMic();return}
    if(recL){await MyVoice.stop();recL=null}
    try{player.pause()}catch(e){}
    if(!MyVoice.canRecord()) return toast('Recording is not available in this browser view. Open the installed app to record.');
    try{await MyVoice.start((lv,tm)=>recUI(l,lv,tm));recL=l;recUI(l,0,0)}catch(err){toast(err&&err.name==='NotAllowedError'?'Microphone permission was denied. Allow the microphone for this app in your phone settings.':'Could not start the microphone here.')}
  }
  if(act==='play'){if(recL)return;const t=++token;unlock();const src=await getSrc(cur,l);if(src){const ok=await playClip(src,t,null);if(!ok&&t===token)toast('Could not play: '+(lastErr||'unknown reason'))}}
  if(act==='del'){if(recL)return;await MyVoice.remove(k);toast('Recording deleted');pre={n:0};preload(cur);srcChip();fillMic()}
});
$('#mClose').onclick=closeSheets;
$('#mPrev').onclick=()=>{if(recL)return;cur>1&&show(cur-1)};
$('#mNext').onclick=()=>{if(recL)return;cur<N&&show(cur+1)};
$('#mExp').onclick=async()=>{
  const {blob,count}=await MyVoice.exportZip(); if(!count) return toast('Nothing recorded yet');
  const name='gita-ch1-my-voice.zip', file=new File([blob],name,{type:'application/zip'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Gita Chapter 1 – my voice recordings'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast(`Saved ${count} recordings to ${name}`)};
$('#mImp').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;try{const r=await MyVoice.importFiles(fs);toast(`Imported ${r.ok} recording${r.ok===1?'':'s'}${r.skipped.length?` · ${r.skipped.length} file(s) skipped (name them like 1.21-sa.m4a)`:''}`);pre={n:0};preload(cur);fillMic();srcChip()}catch(err){toast('Import failed: '+err.message)}};
MyVoice.ready.then(srcChip);

/* ---------- cover + install ---------- */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=$('#cInstall');if(b)b.classList.remove('hide')});
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
function openCover(){
  let c=$('#cover'); if(!c){c=document.createElement('div');c.id='cover';document.body.appendChild(c)}
  const last=store.get('cur',1);
  c.innerHTML=`<div class="in"><div class="art">${Scene.cover()}</div>
  <h1>The Gītā, Picture by Picture</h1><div class="dv">अर्जुनविषादयोगः</div>
  <p>Chapter 1 · Arjuna’s Sorrow<br>47 ślokas, each with its own picture, recitation and simple meaning. Swipe or tap Next to turn the page.</p>
  <div class="acts">${last>1?`<button class="btn" id="cGo">Continue at verse ${last}</button><button class="btn alt" id="cStart">Start from verse 1</button>`:`<button class="btn" id="cStart">Begin</button>`}
  <button class="btn alt ${deferred?'':'hide'}" id="cInstall">Install on this phone</button></div>
  <div class="tiny">${standalone?'':ios?'To install: tap the Share button, then “Add to Home Screen”.':'To install: open your browser menu and choose “Install app” or “Add to Home screen”.'}<br>Recitation uses your phone’s Hindi/Sanskrit voice, so it works offline once installed.</div></div>`;
  c.classList.remove('hide');
  const go=n=>{c.classList.add('hide');show(n)};
  $('#cStart').onclick=()=>go(1); if($('#cGo'))$('#cGo').onclick=()=>go(last);
  $('#cInstall').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#cInstall').classList.add('hide')};
}
applyView(); show(cur); openCover();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script></body></html>
